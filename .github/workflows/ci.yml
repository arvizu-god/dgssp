name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        # Constrained to the paper's pinned versions (paper/requirements-lock.txt).
        # Unpinned, pip takes the newest Qiskit, whose transpiler routes the
        # recorded hardware circuits differently: qiskit 2.6.1 /
        # qiskit-ibm-runtime 0.51.0 gave P-n4-M0-09 1231 CZs against the
        # recorded 1206, and the reproduction test failed.  scipy 1.17 and
        # matplotlib 3.11 have no Python 3.10 wheels, so 3.10 takes every
        # other pin (the Qiskit stack and numpy) and pip's choice for those two.
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            grep -v -E '^(scipy|matplotlib)==' paper/requirements-lock.txt > "$RUNNER_TEMP/constraints.txt"
          else
            cp paper/requirements-lock.txt "$RUNNER_TEMP/constraints.txt"
          fi
          pip install -c "$RUNNER_TEMP/constraints.txt" -e ".[dev,data,viz]"

      - name: Lint
        run: ruff check src tests paper/scripts

      - name: Test
        # Hardware tests are skipped automatically: no IBM credentials are
        # available in CI, so only ideal and fake-backend paths run.
        run: pytest --cov=dgssp --cov-report=term-missing

  typecheck:
    # Type checking runs once, on the Python version the paper's environment
    # actually uses, rather than once per matrix entry.  The matrix exists to
    # prove the *library* imports and runs on 3.10-3.12, which pytest does.
    # Running mypy three times instead checked our code against three
    # different dependency resolutions -- and it was numpy's stubs, not our
    # code, that differed: pip installs numpy 2.2 on 3.10, 2.4 on 3.11 and 2.5
    # on 3.12, and numpy >= 2.5 writes PEP 695 `type` statements in its stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev extras
        # The paper's pinned versions, as in the test job.
        run: |
          python -m pip install --upgrade pip
          pip install -c paper/requirements-lock.txt -e ".[dev,data,viz]"

      - name: Type check
        # Not advisory: the paper's results files are only as trustworthy as
        # the code that writes them, so a type error is a build failure.
        run: mypy src/dgssp paper/scripts

  install-from-git:
    # Guards the packaging acceptance criterion: a clean venv must be able to
    # pip-install the repo and import it without any ImportError.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install .
          /tmp/fresh/bin/python -c "import dgssp; print(dgssp.__version__)"
