name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/dgssp
        continue-on-error: true

      - name: Test
        # Hardware tests are skipped automatically: no IBM credentials are
        # available in CI, so only ideal and fake-backend paths run.
        run: pytest --cov=dgssp --cov-report=term-missing

  install-from-git:
    # Guards the packaging acceptance criterion: a clean venv must be able to
    # pip-install the repo and import it without any ImportError.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install .
          /tmp/fresh/bin/python -c "import dgssp; print(dgssp.__version__)"
